<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>

    <link rel="stylesheet" href="../public/style.css" />
  </head>
  <body>
    <h1>Expense Tracker</h1>

    <div>
      <input
        type="text"
        name=""
        id="expense-input"
        placeholder="enter expense"
      />

      <input type="number" name="" id="sum-input" placeholder="enter amount" />

      <select id="category">
        <option value="Market">Market</option>
        <option value="Clothes">Clothes</option>
        <option value="Bills">Bills</option>
        <option value="Pharmacy">Pharmacy</option>
        <option value="Transport">Transport</option>
        <option value="Restaurants">Restaurants</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <button class="add-expense">Add Expense</button>
    </div>

    <div>
      <div class="time-filters">
        <button class="time-btn" data-range="all">All</button>
        <button class="time-btn" data-range="day">Daily</button>
        <button class="time-btn" data-range="week">Weekly</button>
        <button class="time-btn" data-range="month">Monthly</button>
      </div>

      <div class="sort-filters">
        <button class="sort-btn" data-sort="date-new">Newest</button>
        <button class="sort-btn" data-sort="date-old">Oldest</button>
        <button class="sort-btn" data-sort="amount-high">
          Price: High to Low
        </button>
        <button class="sort-btn" data-sort="amount-low">
          Price: Low to High
        </button>
      </div>

      <ol class="expense-lists"></ol>

      <button id="sum-expenses">Sum Expenses</button>
      <p>Total: <span id="total-sum">0</span></p>
    </div>

    <script src="../public/script.js"></script>
  </body>
</html>
